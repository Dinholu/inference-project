<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Détection d'objets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 p-4 text-center">
    <h1 class="text-3xl font-bold mb-4">Détection d’objets alimentaires</h1>

    <div class="max-w-xl mx-auto space-y-4">
      <input
        type="text"
        id="apiUrl"
        placeholder="http://localhost:3000/proxy"
        class="w-full p-2 border rounded"
      />

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        class="w-full p-2 border rounded"
      />

      <button
        onclick="sendImage()"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
      >
        Envoyer
      </button>

      <div id="image-container" class="relative w-full max-w-full mx-auto">
        <img
          id="preview"
          src="#"
          alt="Aperçu"
          class="max-w-full max-h-[80vh] mx-auto hidden"
        />
        <canvas
          id="overlay"
          class="absolute top-0 left-0 pointer-events-none"
        ></canvas>
      </div>

      <div
        id="results"
        class="bg-white p-4 rounded shadow text-left hidden"
      ></div>
    </div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const preview = document.getElementById("preview");
      const overlay = document.getElementById("overlay");
      const resultsDiv = document.getElementById("results");
      const apiUrlInput = document.getElementById("apiUrl");

      const COLORS = {
        twix: "red",
        compote: "green",
        brownie: "blue",
        barre_protéine: "purple",
        mars: "orange",
        canette: "cyan",
        kinder_cards: "pink",
        sondey_carré: "yellow",
        oeuf: "brown",
        lapin_pâques: "violet",
      };

      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
          preview.onload = () => {
            preview.classList.remove("hidden");
            const ratio = preview.naturalWidth / preview.naturalHeight;
            overlay.width = preview.clientWidth;
            overlay.height = preview.clientWidth / ratio;
            overlay.style.width = `${overlay.width}px`;
            overlay.style.height = `${overlay.height}px`;
          };
        }
      });

      async function sendImage() {
        const file = imageInput.files[0];
        const apiUrl = apiUrlInput.value;
        if (!file || !apiUrl) {
          alert("Choisis une image ET une URL !");
          return;
        }

        const formData = new FormData();
        formData.append("image", file);
        formData.append("targetUrl", apiUrl); // 👈 on envoie l'URL cible au backend

        try {
          const response = await fetch("http://localhost:3000/proxy", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) throw new Error("Erreur lors de l'envoi");

          const data = await response.json();
          displayResults(data);
          drawBoxes(data.boxes);
        } catch (error) {
          resultsDiv.innerHTML = `<p class="text-red-600">Erreur : ${error.message}</p>`;
          resultsDiv.classList.remove("hidden");
        }
      }

      function displayResults(data) {
        if (!data || !data.boxes) {
          resultsDiv.innerHTML = "<p>Aucune donnée retournée.</p>";
          return;
        }

        let html = `<h2 class="font-semibold mb-2">Résultats (${data.boxes.length})</h2><ul class="list-disc pl-5">`;
        data.boxes.forEach((box) => {
          html += `<li><strong>${box.class_name}</strong> — ${(
            box.confidence * 100
          ).toFixed(2)}%</li>`;
        });
        html += `</ul><p class="mt-2 text-sm text-gray-500">Temps : ${data.inference_time.toFixed(
          2
        )} ms</p>`;

        resultsDiv.innerHTML = html;
        resultsDiv.classList.remove("hidden");
      }

      function drawBoxes(boxes) {
        const ctx = overlay.getContext("2d");
        ctx.clearRect(0, 0, overlay.width, overlay.height);

        const scaleX = overlay.width / preview.naturalWidth;
        const scaleY = overlay.height / preview.naturalHeight;

        boxes.forEach((box) => {
          const [x1, y1, x2, y2] = box.xyxy.map(Number);
          const color = COLORS[box.class_name] || "black";

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.strokeRect(
            x1 * scaleX,
            y1 * scaleY,
            (x2 - x1) * scaleX,
            (y2 - y1) * scaleY
          );

          ctx.fillStyle = color;
          ctx.font = "16px Arial";
          ctx.fillText(box.class_name, x1 * scaleX + 4, y1 * scaleY + 16);
        });
      }
    </script>
  </body>
</html>
