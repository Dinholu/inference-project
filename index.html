<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Détection d'objets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100 p-4 text-center">
    <h1 class="text-3xl font-bold mb-4">Détection d’objets</h1>

    <div class="max-w-xl mx-auto space-y-4">
      <input
        type="text"
        id="apiUrl"
        placeholder="rentrez l'URL de l'API + /predict"
        class="w-full p-2 border rounded"
      />

      <label for="imageInput" class="block text-left font-medium mb-1"></label>
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        class="w-full p-2 border rounded"
        title="Choisissez une image à envoyer"
        placeholder="Choisissez une image"
      />

      <button
        onclick="sendImage()"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
      >
        Envoyer
      </button>
      <div
        id="spinner"
        class="fixed inset-0 bg-white/60 backdrop-blur-sm flex justify-center items-center z-50 hidden"
      >
        >
        <svg
          class="animate-spin h-12 w-12 text-white"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
          ></path>
        </svg>
      </div>

      <div class="relative w-full mx-auto">
        <canvas
          id="canvas"
          class="w-full max-h-[80vh] mx-auto rounded shadow"
        ></canvas>
      </div>

      <div
        id="results"
        class="bg-white p-4 rounded shadow text-left hidden"
      ></div>
    </div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const resultsDiv = document.getElementById("results");
      const apiUrlInput = document.getElementById("apiUrl");
      const spinner = document.getElementById("spinner");

      const COLORS = {
        twix: "red",
        compote: "green",
        brownie: "blue",
        barre_protéine: "purple",
        mars: "orange",
        canette: "cyan",
        kinder_cards: "pink",
        sondey_carré: "yellow",
        oeuf: "brown",
        lapin_pâques: "violet",
      };

      let originalImage = null;
      let naturalWidth = 0;
      let naturalHeight = 0;

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        if (!file || !file.type.startsWith("image/")) return;

        const img = new Image();
        img.onload = () => {
          naturalWidth = img.width;
          naturalHeight = img.height;

          const containerWidth = canvas.clientWidth || 600;
          const scale = containerWidth / img.width;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = URL.createObjectURL(file);
        originalImage = file;
      });

      async function sendImage() {
        const file = originalImage;
        const apiUrl = apiUrlInput.value;
        if (!file || !apiUrl) {
          alert("Image ou URL manquante");
          return;
        }

        const formData = new FormData();
        formData.append("image", file);
        formData.append("targetUrl", apiUrl);

        spinner.classList.remove("hidden");
        try {
          saveApiUrlToCookie(apiUrl);
          const response = await fetch("http://localhost:3000/proxy", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) throw new Error("Erreur lors de l'envoi");

          const data = await response.json();
          displayResults(data);
          drawBoxes(data.boxes);
        } catch (error) {
          resultsDiv.innerHTML = `<p class="text-red-600">Erreur : ${error.message}</p>`;
          resultsDiv.classList.remove("hidden");
        } finally {
          spinner.classList.add("hidden");
        }
      }

      function displayResults(data) {
        if (!data || !data.boxes) {
          resultsDiv.innerHTML = "<p>Aucune donnée retournée.</p>";
          return;
        }

        let html = `<h2 class="font-semibold mb-2">Résultats (${data.boxes.length})</h2><ul class="list-disc pl-5">`;
        data.boxes.forEach((box) => {
          html += `<li><strong>${box.class_name}</strong> — ${(
            box.confidence * 100
          ).toFixed(2)}%</li>`;
        });
        html += `</ul><p class="mt-2 text-sm text-gray-500">Temps : ${data.inference_time.toFixed(
          2
        )} ms</p>`;

        resultsDiv.innerHTML = html;
        resultsDiv.classList.remove("hidden");
      }

      function drawBoxes(boxes) {
        if (!boxes || boxes.length === 0) return;

        // redraw image first
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const scaleX = canvas.width / naturalWidth;
          const scaleY = canvas.height / naturalHeight;

          boxes.forEach((box) => {
            const [x1, y1, x2, y2] = box.xyxy.map(Number);
            const color = COLORS[box.class_name] || "black";

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(
              x1 * scaleX,
              y1 * scaleY,
              (x2 - x1) * scaleX,
              (y2 - y1) * scaleY
            );

            ctx.fillStyle = color;
            ctx.font = "16px Arial";
            ctx.fillText(box.class_name, x1 * scaleX + 4, y1 * scaleY + 16);
          });
        };
        img.src = URL.createObjectURL(originalImage);
      }

      // Enregistre l'URL dans un cookie (exp 30 jours)
      function saveApiUrlToCookie(url) {
        document.cookie = `apiUrl=${encodeURIComponent(
          url
        )}; max-age=2592000; path=/`;
      }

      // Lit l'URL depuis les cookies
      function loadApiUrlFromCookie() {
        const match = document.cookie.match(/(?:^|;) *apiUrl=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      // Applique l'URL depuis les cookies si dispo
      window.addEventListener("DOMContentLoaded", () => {
        const savedUrl = loadApiUrlFromCookie();
        if (savedUrl) {
          apiUrlInput.value = savedUrl;
        }
      });
    </script>
  </body>
</html>
