<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Détection d'objets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 text-center"
  >
    <h1 class="text-3xl font-bold mb-4">Détection d’objets alimentaires</h1>

    <div class="max-w-xl mx-auto space-y-4">
      <input
        type="text"
        id="apiUrl"
        placeholder="Entrez l'URL de l'API + /predict"
        class="w-full p-2 border rounded bg-white dark:bg-gray-800 dark:text-white"
      />

      <div id="image-select" class="space-y-4">
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          capture="environment"
          class="w-full p-2 border rounded"
        />

        <div id="webcam-wrapper" class="hidden space-y-4">
          <video
            id="webcam"
            autoplay
            playsinline
            class="w-full rounded"
          ></video>
          <button
            id="captureBtn"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
          >
            Capturer depuis webcam
          </button>
        </div>
      </div>

      <button
        onclick="sendImage()"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
      >
        Envoyer
      </button>

      <div
        id="spinner"
        class="fixed inset-0 bg-white/70 dark:bg-black/70 backdrop-blur-sm flex justify-center items-center h-screen z-50 hidden"
      >
        <svg
          class="animate-spin h-12 w-12 text-blue-600 dark:text-blue-300"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
          ></path>
        </svg>
      </div>

      <div class="relative w-full mx-auto">
        <canvas
          id="canvas"
          class="w-full max-h-[80vh] mx-auto rounded shadow"
        ></canvas>
      </div>

      <div
        id="results"
        class="bg-white dark:bg-gray-800 p-4 rounded shadow text-left hidden"
      ></div>
    </div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const resultsDiv = document.getElementById("results");
      const apiUrlInput = document.getElementById("apiUrl");
      const spinner = document.getElementById("spinner");
      const webcam = document.getElementById("webcam");
      const webcamWrapper = document.getElementById("webcam-wrapper");
      const captureBtn = document.getElementById("captureBtn");

      const COLORS = {
        twix: "red",
        compote: "green",
        brownie: "blue",
        barre_protéine: "purple",
        mars: "orange",
        canette: "cyan",
        kinder_cards: "pink",
        sondey_carré: "yellow",
        oeuf: "brown",
        lapin_pâques: "violet",
      };

      let originalImage = null;
      let naturalWidth = 0;
      let naturalHeight = 0;

      function isMobile() {
        return /Mobi|Android|iPhone/i.test(navigator.userAgent);
      }

      if (!isMobile()) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then((stream) => {
            webcam.srcObject = stream;
            webcamWrapper.classList.remove("hidden");
          })
          .catch((err) => console.warn("Webcam non disponible :", err));
      }

      captureBtn?.addEventListener("click", () => {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = webcam.videoWidth;
        tempCanvas.height = webcam.videoHeight;
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.drawImage(webcam, 0, 0);

        tempCanvas.toBlob((blob) => {
          if (blob) {
            originalImage = new File([blob], "capture.jpg", {
              type: "image/jpeg",
            });

            const img = new Image();
            img.onload = () => {
              naturalWidth = img.width;
              naturalHeight = img.height;
              canvas.width = img.width;
              canvas.height = img.height;
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

              // 🚫 Cacher la webcam après capture
              webcamWrapper.classList.add("hidden");
              const stream = webcam.srcObject;
              if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach((track) => track.stop());
              }
              webcam.srcObject = null;
            };
            img.src = URL.createObjectURL(originalImage);
          }
        }, "image/jpeg");
      });

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        if (!file || !file.type.startsWith("image/")) return;

        const img = new Image();
        img.onload = () => {
          naturalWidth = img.width;
          naturalHeight = img.height;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = URL.createObjectURL(file);
        originalImage = file;
      });

      async function sendImage() {
        const apiUrl = apiUrlInput.value.trim();
        if (!originalImage || !apiUrl) {
          alert("Image ou URL manquante");
          return;
        }

        spinner.classList.remove("hidden");
        saveApiUrlToCookie(apiUrl);

        const img = new Image();
        img.src = URL.createObjectURL(originalImage);

        img.onload = async () => {
          const convertCanvas = document.createElement("canvas");
          convertCanvas.width = img.naturalWidth;
          convertCanvas.height = img.naturalHeight;
          const convertCtx = convertCanvas.getContext("2d");
          convertCtx.drawImage(img, 0, 0);

          convertCanvas.toBlob(
            async (jpegBlob) => {
              const formData = new FormData();
              formData.append("image", jpegBlob, "converted.jpg");
              formData.append("targetUrl", apiUrl);

              try {
                const response = await fetch("/proxy", {
                  method: "POST",
                  body: formData,
                });

                if (!response.ok) throw new Error("Erreur lors de l'envoi");
                const data = await response.json();
                displayResults(data);
                drawBoxes(data.boxes);
              } catch (error) {
                resultsDiv.innerHTML = `<p class="text-red-600">Erreur : ${error.message}</p>`;
                resultsDiv.classList.remove("hidden");
              } finally {
                spinner.classList.add("hidden");
              }
            },
            "image/jpeg",
            0.95
          );
        };
      }

      function displayResults(data) {
        if (!data || !data.boxes) {
          resultsDiv.innerHTML = "<p>Aucune donnée retournée.</p>";
          return;
        }

        let html = `<h2 class="font-semibold mb-2">Résultats (${data.boxes.length})</h2><ul class="list-disc pl-5">`;
        data.boxes.forEach((box) => {
          html += `<li><strong>${box.class_name}</strong> — ${(
            box.confidence * 100
          ).toFixed(2)}%</li>`;
        });
        html += `</ul><p class="mt-2 text-sm text-gray-500">Temps : ${data.inference_time.toFixed(
          2
        )} ms</p>`;
        resultsDiv.innerHTML = html;
        resultsDiv.classList.remove("hidden");
      }

      function drawBoxes(boxes) {
        if (!boxes || boxes.length === 0) return;

        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const scaleX = canvas.width / naturalWidth;
          const scaleY = canvas.height / naturalHeight;

          boxes.forEach((box) => {
            const [x1, y1, x2, y2] = box.xyxy.map(Number);
            const color = COLORS[box.class_name] || "black";

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(
              x1 * scaleX,
              y1 * scaleY,
              (x2 - x1) * scaleX,
              (y2 - y1) * scaleY
            );

            ctx.fillStyle = color;
            ctx.font = "16px Arial";
            ctx.fillText(box.class_name, x1 * scaleX + 4, y1 * scaleY + 16);
          });
        };
        img.src = URL.createObjectURL(originalImage);
      }

      function saveApiUrlToCookie(url) {
        document.cookie = `apiUrl=${encodeURIComponent(
          url
        )}; max-age=2592000; path=/`;
      }

      function loadApiUrlFromCookie() {
        const match = document.cookie.match(/(?:^|;) *apiUrl=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      window.addEventListener("DOMContentLoaded", () => {
        const savedUrl = loadApiUrlFromCookie();
        if (savedUrl) {
          apiUrlInput.value = savedUrl;
        }
      });
    </script>
  </body>
</html>
